# This is the name of the workflow that will display in Actions tab

name: CI/CD

# Manual click (Continous Delivery) when ever we need

on:
  workflow_dispatch:
    inputs:
      environments:
        description: This is the environment value where workflow runs
        default: dev
        type: choice
        required: true
        options:
          - dev
          - stag
          - prod

jobs:
  code:
    runs-on: ubuntu-slim
    steps:
      - name: Code Checkout
        run: echo "Code checkout from GitHub"
  build:
    needs: [code]
    runs-on: ubuntu-slim
    steps:
      - name: Code Build using Docker
        run: echo "Building using Docker build"
  test:
    needs: [build]
    runs-on: ubuntu-slim
    steps:
      - name: Code is Tested
        run: echo "Testing the docker container"
  deploy:
    needs: [code, build, test]
    runs-on: ubuntu-slim
    steps:
      - name: Deploying the Code
        run: echo "deployed the code using docker compose concept"
